name: "Terraform Apply (Main)"

# Triggers a full plan + apply when a PR merges to main.
# HCP Terraform handles the actual execution.

on:
  push:
    branches:
      - main
    paths:
      - "**.tf"
      - "**.tfvars"
      - "user_data.sh"

permissions:
  contents: read

jobs:
  terraform-apply:
    name: "Plan and Apply"
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------
      # 1. Checkout
      # -----------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------
      # 2. Setup Terraform pointed at HCP Terraform
      # -----------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      # -----------------------------------------------
      # 3. Init
      # -----------------------------------------------
      - name: Terraform Init
        run: terraform init

      # -----------------------------------------------
      # 4. Validate
      # -----------------------------------------------
      - name: Terraform Validate
        run: terraform validate -no-color

      # -----------------------------------------------
      # 5. Apply
      #    In HCP Terraform remote mode, `terraform apply` triggers a
      #    full plan + apply run in a single HCP Terraform run.
      #    DO NOT add a separate `terraform plan` step before this —
      #    it would kick off a second, redundant run in HCP Terraform.
      #
      #    GitHub Actions built-in env vars are passed as -var flags so
      #    they get baked into user_data.sh at apply time, proving the
      #    deployment came from this exact workflow run.
      # -----------------------------------------------
      - name: Terraform Apply
        run: |
          terraform apply -auto-approve -input=false \
            -var="github_run_id=$GITHUB_RUN_ID" \
            -var="github_sha=$GITHUB_SHA" \
            -var="github_actor=$GITHUB_ACTOR"
