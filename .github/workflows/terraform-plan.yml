name: "Terraform Plan (PR)"

# Triggers a speculative plan on every PR to main.
# The plan result posts as a PR comment - no apply happens.

on:
  pull_request:
    branches:
      - main
    paths:
      - "**.tf"
      - "**.tfvars"
      - "user_data.sh"

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-plan:
    name: "Speculative Plan"
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------
      # 1. Checkout the repo
      # -----------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------
      # 2. Setup Terraform CLI and point it at HCP Terraform
      # -----------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      # -----------------------------------------------
      # 3. Initialize (connects to HCP Terraform backend)
      # -----------------------------------------------
      - name: Terraform Init
        id: init
        run: terraform init

      # -----------------------------------------------
      # 4. Validate syntax
      # -----------------------------------------------
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # -----------------------------------------------
      # 5. Run speculative plan - output goes to HCP Terraform
      #    The -no-color flag keeps the PR comment clean
      # -----------------------------------------------
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false
        continue-on-error: true

      # -----------------------------------------------
      # 6. Post plan summary as a PR comment
      # -----------------------------------------------
      - name: Post Plan to PR
        uses: actions/github-script@v7
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Init: \`${{ steps.init.outcome }}\`
            #### Terraform Validate: \`${{ steps.validate.outcome }}\`
            #### Terraform Plan: \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Triggered by @${{ github.actor }} on \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      # -----------------------------------------------
      # 7. Fail the workflow if plan failed
      # -----------------------------------------------
      - name: Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1
